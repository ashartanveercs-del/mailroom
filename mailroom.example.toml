# mailroom configuration. Copy to mailroom.toml and set drive.root_folder_id.
# Unknown keys are errors, so a typo fails at startup instead of being ignored.
# Relative paths are relative to this file.

[mailbox]
# Extra Gmail search terms. mailroom always adds:
#   has:attachment -in:sent -in:drafts -in:spam -in:trash
query = "newer_than:30d"
# Only take mail from these senders (shell-style patterns). Empty means everyone.
allowed_senders = []
max_attachment_mb = 25

[drive]
# The folder mailroom files into: the id at the end of the folder's Drive URL.
root_folder_id = "REPLACE_WITH_YOUR_FOLDER_ID"
review_folder = "Needs review"
# Drive's limit for a single multipart upload; larger documents are skipped and reported.
max_upload_mb = 5

[google]
# Google "authorized user" JSON with client_id, client_secret and refresh_token.
credentials_file = "token.json"

[classifier]
kind = "llm"                    # or "rules": keyword rules only, no model, no key
endpoint = "https://api.openai.com/v1/chat/completions"   # any OpenAI-compatible endpoint
model = "gpt-4o-mini"           # a vision-capable model also reads photos of receipts
api_key_env = "MAILROOM_LLM_API_KEY"
cross_check = true              # the rule classifier must not contradict the model
grounding = true                # every value used in a folder or file name must be in the text
date_order = "MDY"              # how to read 03/04/2026: "MDY" or "DMY"
vision_min_confidence = 0.95    # the bar for documents with no text of their own
vendors = []                    # names the rule classifier may recognise
max_attempts = 3                # classifier failures before a document goes to review

[ledger]
path = "mailroom.db"

[split]
enabled = true                  # cut batch-scanned PDFs at document boundaries

# Document types. Leave these out to get exactly these defaults.
# Templates: {vendor} {number} {title} {total} {type} {date} {date:%Y-%m-%d}

[types.invoice]
description = "A bill from a supplier asking to be paid: an invoice number and an amount due."
folder = "Invoices/{date:%Y}/{vendor}"
filename = "{date:%Y-%m-%d} {vendor} {number}"
keywords = ["invoice", "amount due", "bill to", "payment terms", "due date"]
exclude = ["quote", "quotation", "estimate", "pro forma", "proforma", "credit note",
           "statement of account"]
number_pattern = 'invoice\s*(?:no\.?|number|#)\s*:?\s*([A-Z0-9][A-Z0-9-]{2,})'
min_confidence = 0.85

[types.receipt]
description = "Proof of a payment that has already been made."
folder = "Receipts/{date:%Y-%m}"
filename = "{date:%Y-%m-%d} {vendor} receipt"
keywords = ["receipt", "paid", "payment received", "amount paid", "thank you for your purchase"]
exclude = ["quote", "estimate"]
number_pattern = 'receipt\s*(?:no\.?|number|#)\s*:?\s*([A-Z0-9][A-Z0-9-]{2,})'
min_confidence = 0.85

[types.contract]
description = "An agreement between parties: terms, obligations, signatures."
folder = "Contracts/{vendor}"
filename = "{date:%Y-%m-%d} {title}"
keywords = ["agreement", "contract", "parties", "term", "signature", "governing law"]
min_confidence = 0.9
