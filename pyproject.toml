[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mailroom"
version = "0.1.0"
description = "Inbox-to-cloud-drive document filer: allowlisted read-only intake, write-ahead hash-verified filing, container unpacking and an offline zero-misfile evaluation gate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ashar Tanveer" }]
keywords = ["gmail", "google-drive", "document-processing", "llm", "classification", "write-ahead-log"]
dependencies = [
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
mailroom = "mailroom.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mailroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
